<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="660" viewBox="0 0 1380 660"><rect x="0" y="0" width="1380" height="660" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1"/><text x="42" y="62" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#18324b" font-weight="bold">AI study assistant · failure and recovery</text><text x="42" y="102" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#526579" font-weight="normal">A relevant link does not necessarily support the claim.</text><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#718096"/></marker></defs><rect x="42" y="155" width="311" height="390" rx="16" fill="#e8f1ff" stroke="#2763a5" stroke-width="2"/><text x="58" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2763a5" font-weight="bold">1 · WRONG CLAIM</text><rect x="56" y="210" width="283" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="67" y="222" width="261" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="78" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="69" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Assistant: “Mutually exclusive</text><text x="69" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">events are independent.”</text><text x="69" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Evidence cue: source found.</text><rect x="67" y="415" width="261" height="41" rx="7" fill="#fff4d9" stroke="#b28a38" stroke-width="1"/><text x="77" y="441" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4b3c1c" font-weight="bold">View source</text><text x="58" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The system mistakes topic</text><text x="58" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">relevance for support.</text><path d="M355 356 H367" stroke="#718096" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="370" y="155" width="311" height="390" rx="16" fill="#fff4d9" stroke="#a87912" stroke-width="2"/><text x="386" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#a87912" font-weight="bold">2 · NOTICE</text><rect x="384" y="210" width="283" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="395" y="222" width="261" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="406" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="397" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Source: “Mutually exclusive</text><text x="397" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">means P(A and B)=0.”</text><text x="397" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Student: This alone does not</text><text x="397" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">show independence.</text><text x="386" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The student checks the</text><text x="386" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">passage and spots the gap.</text><path d="M683 356 H695" stroke="#718096" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="698" y="155" width="311" height="390" rx="16" fill="#e7f5ec" stroke="#358154" stroke-width="2"/><text x="714" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#358154" font-weight="bold">3 · REPORT</text><rect x="712" y="210" width="283" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="723" y="222" width="261" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="734" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="725" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Student: This source does not</text><text x="725" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">support that conclusion.</text><text x="725" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Assistant: Report received;</text><text x="725" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">rechecking definitions.</text><rect x="723" y="415" width="261" height="41" rx="7" fill="#fff4d9" stroke="#b28a38" stroke-width="1"/><text x="733" y="441" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4b3c1c" font-weight="bold">Report mismatch</text><text x="714" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The student can correct</text><text x="714" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">the evidence link.</text><path d="M1011 356 H1023" stroke="#718096" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1026" y="155" width="311" height="390" rx="16" fill="#e3f4f3" stroke="#287f7b" stroke-width="2"/><text x="1042" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#287f7b" font-weight="bold">4 · RECOVER</text><rect x="1040" y="210" width="283" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="1051" y="222" width="261" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="1062" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="1053" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Correction: If P(A)&gt;0 and</text><text x="1053" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">P(B)&gt;0, mutual exclusivity</text><text x="1053" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">means the events are not</text><text x="1053" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">independent.</text><text x="1042" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The assistant states the</text><text x="1042" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">condition and conclusion.</text><text x="690" y="595" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#30475c" font-weight="bold">Lesson: check that evidence supports the claim and its conditions.</text></svg>