<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="660" viewBox="0 0 1480 660"><rect x="0" y="0" width="1480" height="660" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="1"/><text x="42" y="62" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#18324b" font-weight="bold">AI study assistant · normal interaction</text><text x="42" y="102" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#526579" font-weight="normal">Example: “If two events are mutually exclusive, are they independent?”</text><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#718096"/></marker></defs><rect x="42" y="155" width="265" height="390" rx="16" fill="#e8f1ff" stroke="#2763a5" stroke-width="2"/><text x="58" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2763a5" font-weight="bold">1 · ASK</text><rect x="56" y="210" width="237" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="67" y="222" width="215" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="78" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="69" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Student: Are mutually exclusive</text><text x="69" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">events independent?</text><text x="58" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The student asks a question</text><text x="58" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">while studying probability.</text><path d="M309 356 H321" stroke="#718096" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="324" y="155" width="265" height="390" rx="16" fill="#f0eaff" stroke="#7350a3" stroke-width="2"/><text x="340" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7350a3" font-weight="bold">2 · ANSWER</text><rect x="338" y="210" width="237" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="349" y="222" width="215" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="360" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="351" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Assistant: If P(A)&gt;0 and P(B)&gt;0,</text><text x="351" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">mutually exclusive events</text><text x="351" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">are not independent.</text><text x="340" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">A short answer states</text><text x="340" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">the necessary condition.</text><path d="M591 356 H603" stroke="#718096" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="606" y="155" width="265" height="390" rx="16" fill="#fff4d9" stroke="#a87912" stroke-width="2"/><text x="622" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#a87912" font-weight="bold">3 · CHECK SOURCE</text><rect x="620" y="210" width="237" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="631" y="222" width="215" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="642" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="633" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Evidence cue: The definitions</text><text x="633" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">appear to support this answer.</text><text x="633" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Check the source to verify.</text><rect x="631" y="415" width="215" height="41" rx="7" fill="#fff4d9" stroke="#b28a38" stroke-width="1"/><text x="641" y="441" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4b3c1c" font-weight="bold">View source</text><text x="622" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The student opens the</text><text x="622" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">passage beside the claim.</text><path d="M873 356 H885" stroke="#718096" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="888" y="155" width="265" height="390" rx="16" fill="#e7f5ec" stroke="#358154" stroke-width="2"/><text x="904" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#358154" font-weight="bold">4 · COMPARE</text><rect x="902" y="210" width="237" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="913" y="222" width="215" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="924" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="915" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Course notes: P(A and B)=0 for</text><text x="915" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">mutually exclusive events.</text><text x="915" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Independence needs</text><text x="915" y="357" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">P(A and B)=P(A)P(B).</text><text x="904" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The student compares the</text><text x="904" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">conditions with the answer.</text><path d="M1155 356 H1167" stroke="#718096" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1170" y="155" width="265" height="390" rx="16" fill="#e3f4f3" stroke="#287f7b" stroke-width="2"/><text x="1186" y="188" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#287f7b" font-weight="bold">5 · DECIDE</text><rect x="1184" y="210" width="237" height="258" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1"/><rect x="1195" y="222" width="215" height="32" rx="7" fill="#eff4f9" stroke="#eff4f9" stroke-width="1"/><text x="1206" y="244" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#334b63" font-weight="bold">AI Study Assistant</text><text x="1197" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">Student: If both probabilities</text><text x="1197" y="309" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">are positive, the two</text><text x="1197" y="333" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#24364b" font-weight="normal">conditions cannot both hold.</text><rect x="1195" y="415" width="215" height="41" rx="7" fill="#fff4d9" stroke="#b28a38" stroke-width="1"/><text x="1205" y="441" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#4b3c1c" font-weight="bold">Accept · Ask more</text><text x="1186" y="496" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">The student accepts the</text><text x="1186" y="517" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#30475c" font-weight="normal">answer and continues.</text></svg>